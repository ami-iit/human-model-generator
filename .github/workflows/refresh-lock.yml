name: Refresh pixi lock

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: false
          run-install: false

      - run: pixi update

      - run: pixi run test

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh pixi.lock"
          title: "chore: refresh pixi.lock"
          body: Automated weekly update of `pixi.lock`, tests passed.
          branch: refresh-pixi-lock
          add-paths: pixi.lock

      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly pixi.lock refresh failed (run #${context.runNumber})`,
              body: `The scheduled pixi.lock refresh failed. See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["dependencies"],
            });
