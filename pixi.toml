[workspace]
name = "human-model-generator"
version = "2.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.9"
numpy = "*"
idyntree = "*"
urchin = "*"
urdf-modifiers = "*"
pytest = "*"

[pypi-dependencies]
human-model-generator = { path = ".", editable = true }

[tasks]
generate = "hmg-generate"
test = "pytest"
